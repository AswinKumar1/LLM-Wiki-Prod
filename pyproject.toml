[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki-universal"
version = "0.1.0"
description = "Provider-agnostic LLM Wiki — works with Ollama, OpenAI, Anthropic, or any compatible model"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alwin Kumar", email = "" }]
keywords = ["llm", "wiki", "knowledge-base", "rag", "ollama", "karpathy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = []  # zero required deps — stdlib only for the core

[project.optional-dependencies]
yaml   = ["pyyaml>=6.0"]
search = ["numpy>=1.24"]
all    = ["pyyaml>=6.0", "numpy>=1.24"]
dev    = ["pytest>=8.0", "pytest-cov", "ruff", "mypy"]

[project.scripts]
wiki = "llm_wiki.cli:main"

[project.urls]
Homepage   = "https://github.com/AswinKumar1/LLM-Wiki-Prod"
Repository = "https://github.com/AswinKumar1/LLM-Wiki-Prod"
Issues     = "https://github.com/AswinKumar1/LLM-Wiki-Prod/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["llm_wiki*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
